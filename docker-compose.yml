services:
  film4k-webproxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: "${BUILD_COMMIT:?BUILD_COMMIT environment variable is required for build provenance}"
    image: film4k-webproxy:${IMAGE_TAG:?IMAGE_TAG environment variable is required (e.g. commit SHA or release tag)}
    container_name: film4k-webproxy
    restart: always
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - DATABASE_PATH=/app/data/movies.db
      - RUST_LOG=info
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - BUILD_COMMIT=${BUILD_COMMIT:?BUILD_COMMIT is required}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
