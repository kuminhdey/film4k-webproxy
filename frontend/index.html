    <script>
      // Self-healing recovery for stale PWA service worker caches and chunk load mismatches
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? e.message : '';
        if (
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('before initialization') !== -1
        ) {
          if (!sessionStorage.getItem('bofilm_cache_healed')) {
            sessionStorage.setItem('bofilm_cache_healed', '1');
            console.warn('[BơFilm Recovery] Stale cache detected, purging service worker and caches...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
            setTimeout(function () {
              window.location.reload();
            }, 100);
          }
        }
      });
    </script>
