    <script>
      (function () {
        function isStaleChunkError(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return (
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('before initialization') !== -1
          );
        }

        function healStaleCache() {
          try {
            if (sessionStorage.getItem('bofilm_cache_healed')) return;
            sessionStorage.setItem('bofilm_cache_healed', '1');
          } catch (_) {}
          console.warn('[BơFilm Recovery] Stale cache detected, purging service worker and caches...');
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          Promise.all(tasks).finally(function () {
            window.location.reload();
          });
        }

        window.addEventListener('error', function (e) {
          var msg = (e && e.message) ? e.message : '';
          if (isStaleChunkError(msg)) healStaleCache();
        });

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (isStaleChunkError(msg)) healStaleCache();
        });
      })();
    </script>
